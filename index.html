<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#ffd700;
}
.container{
max-width:420px;
margin:25px auto;
padding:22px;
background:rgba(255,215,0,.08);
border-radius:20px;
box-shadow:0 0 40px rgba(255,215,0,.25);
}
h1,h2{text-align:center;}
.stats{
display:flex;
gap:10px;
margin:15px 0;
}
.stat{
flex:1;
background:#111;
padding:12px;
border-radius:15px;
text-align:center;
}
.timer{text-align:center;margin:15px 0;}
.btn{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
background:linear-gradient(135deg,#ffd700,#ffb300);
cursor:pointer;
}
.support{
position:fixed;
right:15px;
bottom:90px;
width:54px;
height:54px;
border-radius:50%;
background:#ffd700;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
text-decoration:none;
color:#000;
box-shadow:0 0 25px rgba(255,215,0,.7);
}
input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-bottom:10px;
}
</style>
</head>

<body>

<!-- USER LANDING -->
<div id="userPage">
  <div class="container">
    <h1>👑 Gold VIP Access</h1>

    <div class="stats">
      <div class="stat">
        <h2 id="live">0</h2>
        <p>Live Users</p>
      </div>
      <div class="stat">
        <h2 id="reg">0</h2>
        <p>Registrations</p>
      </div>
    </div>

    <div class="timer">
      ⏳ Offer Ends In<br>
      <strong id="time"></strong>
    </div>

    <button class="btn" onclick="register()">Free Registration</button>
    <button class="btn" onclick="joinTG()">Join Telegram</button>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin" style="display:none">
  <div class="container">
    <h2>🔐 Admin Login</h2>
    <input id="adminEmail" type="email" placeholder="Admin Email">
    <input id="adminPass" type="password" placeholder="Password">
    <button class="btn" onclick="adminLogin()">Login</button>
    <p id="adminError" style="color:red;text-align:center"></p>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminDash" style="display:none">
  <div class="container">
    <h2>📊 Admin Dashboard</h2>
    <p>Live Users: <strong id="a_live">0</strong></p>
    <p>Total Registrations: <strong id="a_reg">0</strong></p>
    <button class="btn" onclick="logout()">Logout</button>
  </div>
</div>

<!-- Telegram Support -->
<a class="support" href="https://t.me/yourusername" target="_blank">💬</a>

<!-- Tawk.to -->

s1.charset='UTF-8';

<script>
// 🔗 CHANGE THESE LINKS
const SIGNUP = "https://example.com/signup";
const TG = "https://t.me/yourchannel";

// 🔥 FIREBASE CONFIG (FINAL)
firebase.initializeApp({
  apiKey: "AIzaSyDpeyBpdODVkyZ3-uS1sgpBNHGAetrd5dM",
  databaseURL: "https://updatehubs-f3fe7-default-rtdb.firebaseio.com",
  projectId: "updatehubs-f3fe7"
});

const db = firebase.database();
const auth = firebase.auth();

// Live users
db.ref("live").transaction(n => (n || 0) + 1);
db.ref("live").on("value", s => {
  live.innerText = s.val() || 0;
  a_live.innerText = s.val() || 0;
});
db.ref("reg").on("value", s => {
  reg.innerText = s.val() || 0;
  a_reg.innerText = s.val() || 0;
});

// Countdown
let end = localStorage.endTime || Date.now() + 3600000;
localStorage.endTime = end;
setInterval(()=>{
let d=end-Date.now();
if(d<0)d=0;
time.innerText =
Math.floor(d/60000)+"m "+
Math.floor((d%60000)/1000)+"s";
},1000);

// Buttons
function register(){
fbq('track','CompleteRegistration');
db.ref("reg").transaction(n=>(n||0)+1);
setTimeout(()=>location.href=SIGNUP,2000);
}
function joinTG(){
fbq('track','Contact');
setTimeout(()=>location.href=TG,1500);
}

// 🔐 ADMIN MODE
if(location.hash === "#admin"){
  document.getElementById("userPage").style.display="none";
  document.getElementById("adminLogin").style.display="block";
}

function adminLogin(){
  auth.signInWithEmailAndPassword(
    adminEmail.value,
    adminPass.value
  ).then(()=>{
    adminLoginBox();
  }).catch(()=>{
    adminError.innerText="Invalid login";
  });
}

function adminLoginBox(){
  document.getElementById("adminLogin").style.display="none";
  document.getElementById("adminDash").style.display="block";
}

function logout(){
  auth.signOut().then(()=>{
    location.href=location.pathname;
  });
}
</script>

</body>
</html>
