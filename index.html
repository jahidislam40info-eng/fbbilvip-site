<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Landing</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{margin:0;font-family:Arial;background:#000;color:#ffd700}
.container{max-width:420px;margin:25px auto;padding:20px;background:rgba(255,215,0,.08);border-radius:20px}
h1,h2{text-align:center}
.btn{width:100%;padding:14px;margin:8px 0;border:none;border-radius:15px;background:#ffd700;font-weight:bold}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:none}
.logo{display:block;margin:0 auto 10px;max-width:120px}
.support{position:fixed;right:15px;bottom:90px;width:55px;height:55px;border-radius:50%;background:#ffd700;display:flex;align-items:center;justify-content:center;font-size:22px;color:#000;text-decoration:none}
.adminBox{background:#111;padding:15px;border-radius:15px;margin-top:10px}
.list{font-size:13px;margin-top:10px}
</style>
</head>

<body>

<!-- USER PAGE -->
<div id="userPage">
  <div class="container">
    <img id="siteLogo" class="logo" src="">
    <h1 id="siteTitle">VIP Access</h1>
    <p id="siteSub">Limited Offer</p>

    <button class="btn" id="btnReg"></button>
    <button class="btn" id="btnTG"></button>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin" style="display:none">
  <div class="container">
    <h2>Admin Login</h2>
    <input id="adminEmail" placeholder="Email">
    <input id="adminPass" type="password" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
    <p id="err" style="color:red;text-align:center"></p>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminDash" style="display:none">
  <div class="container">
    <h2>Admin Panel</h2>

    <div class="adminBox">
      <h3>Website Settings</h3>
      <input id="logoInp" placeholder="Logo Image URL">
      <input id="titleInp" placeholder="Heading Text">
      <input id="subInp" placeholder="Sub Text">
      <input id="regTextInp" placeholder="Register Button Text">
      <input id="regLinkInp" placeholder="Register URL">
      <input id="tgTextInp" placeholder="Telegram Button Text">
      <input id="tgLinkInp" placeholder="Telegram URL">
      <button class="btn" onclick="saveSettings()">Save</button>
      <p id="saveMsg"></p>
    </div>

    <div class="adminBox">
      <h3>Users</h3>
      <div id="userList" class="list"></div>
    </div>

    <button class="btn" onclick="logout()">Logout</button>
  </div>
</div>

<a class="support" href="https://t.me/yourusername" target="_blank">💬</a>

<script>
// 🔥 FIREBASE CONFIG
firebase.initializeApp({
  apiKey: "AIzaSyDpeyBpdODVkyZ3-uS1sgpBNHGAetrd5dM",
  databaseURL: "https://updatehubs-f3fe7-default-rtdb.firebaseio.com",
  projectId: "updatehubs-f3fe7"
});

const db = firebase.database();
const auth = firebase.auth();

// Admin route
if(location.hash==="#admin"){
  userPage.style.display="none";
  adminLogin.style.display="block";
}

// Login
function login(){
auth.signInWithEmailAndPassword(adminEmail.value,adminPass.value)
.then(()=>{
 adminLogin.style.display="none";
 adminDash.style.display="block";
 loadUsers();
})
.catch(()=>err.innerText="Invalid login");
}

// Logout
function logout(){
auth.signOut().then(()=>location.href=location.pathname);
}

// Save settings
function saveSettings(){
db.ref("settings").set({
 logo:logoInp.value,
 title:titleInp.value,
 sub:subInp.value,
 regText:regTextInp.value,
 regLink:regLinkInp.value,
 tgText:tgTextInp.value,
 tgLink:tgLinkInp.value
});
saveMsg.innerText="Saved ✅";
}

// Load settings to site
db.ref("settings").on("value",s=>{
 if(!s.exists())return;
 const d=s.val();
 siteLogo.src=d.logo||"";
 siteTitle.innerText=d.title||"";
 siteSub.innerText=d.sub||"";
 btnReg.innerText=d.regText||"Register";
 btnReg.onclick=()=>location.href=d.regLink;
 btnTG.innerText=d.tgText||"Telegram";
 btnTG.onclick=()=>location.href=d.tgLink;
});

// User logging
const uid="u"+Date.now();
db.ref("users/"+uid).set({
 time:new Date().toLocaleString(),
 device:/Mobi/.test(navigator.userAgent)?"Mobile":"Desktop"
});

// Load user list
function loadUsers(){
db.ref("users").on("value",s=>{
 userList.innerHTML="";
 s.forEach(c=>{
  const u=c.val();
  userList.innerHTML+=`${u.time} - ${u.device}<br>`;
 });
});
}
</script>

</body>
</html>
